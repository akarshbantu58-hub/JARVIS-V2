<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS - Gemini AI</title>
  <style>
    :root {
      --bg: #050b16;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-2: rgba(17, 24, 39, 0.75);
      --line: rgba(148, 163, 184, 0.3);
      --text: #e5f0ff;
      --muted: #9fb5d1;
      --accent: #67e8f9;
      --accent-2: #8b5cf6;
      --danger: #f87171;
      --success: #4ade80;
      --shadow: rgba(103, 232, 249, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; background: radial-gradient(circle at top, #101a2d, #050b16 60%);
      color: var(--text); font-family: Inter, Arial, sans-serif;
    }
    body { display: flex; justify-content: center; align-items: center; padding: 24px; }
    .app {
      width: min(900px, 100%); background: var(--panel); border: 1px solid var(--line);
      border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 30px var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid var(--line); background: rgba(15, 23, 42, 0.8);
    }
    .brand { font-weight: 800; letter-spacing: 0.16em; }
    .brand span { color: var(--accent); }
    .actions { display: flex; gap: 10px; align-items: center; }
    button {
      border: 1px solid var(--line); background: rgba(15, 23, 42, 0.9); color: var(--text);
      border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 600;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #03141a; border: none;
      box-shadow: 0 0 25px rgba(103, 232, 249, 0.4);
    }
    button.danger { border-color: rgba(248, 113, 113, 0.5); color: var(--danger); }
    .body { display: grid; grid-template-columns: 280px 1fr; min-height: 620px; }
    .sidebar {
      border-right: 1px solid var(--line); background: var(--panel-2); padding: 16px;
    }
    .settings-box {
      padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(15, 23, 42, 0.7);
      margin-bottom: 18px;
    }
    .settings-box h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    label {
      display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%; border-radius: 10px; border: 1px solid var(--line); background: rgba(2, 6, 23, 0.8);
      color: var(--text); padding: 10px 12px; font-size: 14px;
    }
    .content {
      display: flex; flex-direction: column; min-height: 0;
    }
    .chat {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .msg {
      max-width: 82%; padding: 14px 16px; border-radius: 16px; line-height: 1.55;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.72);
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.user { align-self: flex-end; background: rgba(103, 232, 249, 0.14); border-color: rgba(103, 232, 249, 0.45); }
    .msg.assistant { align-self: flex-start; }
    .status-line {
      color: var(--muted); font-size: 12px; padding: 0 20px 10px; min-height: 18px;
    }
    .composer {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 18px 20px 20px; border-top: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.75);
    }
    textarea {
      resize: none; min-height: 52px; max-height: 180px; overflow-y: auto;
    }
    .hint {
      color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5;
    }
    .error { color: var(--danger); font-weight: 600; }
    .ok { color: var(--success); font-weight: 600; }
    @media (max-width: 760px) {
      .body { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span>J.A.R.V.I.S</span> // Gemini</div>
      <div class="actions">
        <button id="saveBtn" class="primary">Save API Key</button>
        <button id="clearBtn" class="danger">Clear</button>
      </div>
    </div>

    <div class="body">
      <aside class="sidebar">
        <div class="settings-box">
          <h3>Gemini settings</h3>
          <label for="apiKeyInput">API key</label>
          <input id="apiKeyInput" type="password" placeholder="Paste Google AI Studio key" />
          <label for="modelSelect">Model</label>
          <select id="modelSelect">
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
            <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
          </select>
          <div class="hint">Get a key from: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:#67e8f9;">Google AI Studio</a></div>
        </div>
      </aside>

      <main class="content">
        <div id="chat" class="chat"></div>
        <div id="statusLine" class="status-line">Ready. Enter your API key and start chatting.</div>
        <div class="composer">
          <textarea id="prompt" placeholder="Ask JARVIS anything..."></textarea>
          <button id="sendBtn" class="primary">Send</button>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { GoogleGenAI } from 'https://esm.run/@google/genai';

    const DEFAULT_MODEL = 'gemini-2.5-flash';
    const LS_KEY = 'jarvis.apiKey';
    const LS_MODEL = 'jarvis.model';

    const chatEl = document.getElementById('chat');
    const statusEl = document.getElementById('statusLine');
    const inputEl = document.getElementById('prompt');
    const apiKeyEl = document.getElementById('apiKeyInput');
    const modelEl = document.getElementById('modelSelect');

    let genai = null;
    let currentModel = localStorage.getItem(LS_MODEL) || DEFAULT_MODEL;
    let abortController = null;

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status-line';
      if (type === 'error') statusEl.classList.add('error');
      if (type === 'ok') statusEl.classList.add('ok');
    }

    function saveApiKey() {
      const key = apiKeyEl.value.trim();
      if (!key) {
        localStorage.removeItem(LS_KEY);
        genai = null;
        setStatus('API key cleared. Add a valid key to continue.', 'error');
        return;
      }
      localStorage.setItem(LS_KEY, key);
      localStorage.setItem(LS_MODEL, modelEl.value || DEFAULT_MODEL);
      initGenAI();
      setStatus('API key saved and ready.', 'ok');
    }

    function clearApiKey() {
      localStorage.removeItem(LS_KEY);
      localStorage.removeItem(LS_MODEL);
      apiKeyEl.value = '';
      modelEl.value = DEFAULT_MODEL;
      genai = null;
      setStatus('API key cleared.', 'error');
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      msg.textContent = text;
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function initGenAI() {
      const key = (localStorage.getItem(LS_KEY) || '').trim();
      if (!key) {
        genai = null;
        setStatus('No API key found. Add one in settings.', 'error');
        return;
      }

      try {
        genai = new GoogleGenAI({ apiKey: key });
        currentModel = localStorage.getItem(LS_MODEL) || DEFAULT_MODEL;
        modelEl.value = currentModel;
        setStatus('Gemini connected successfully.', 'ok');
      } catch (error) {
        genai = null;
        setStatus(`API setup failed: ${error?.message || String(error)}`, 'error');
      }
    }

    function isValidApiKey(key) {
      return typeof key === 'string' && key.trim().length > 10;
    }

    async function askGemini(promptText) {
      const key = (localStorage.getItem(LS_KEY) || '').trim();
      if (!key || !isValidApiKey(key)) {
        setStatus('API key is missing or invalid. Save a valid Google AI Studio key first.', 'error');
        return;
      }

      if (!genai) {
        await initGenAI();
      }

      if (!genai) {
        return;
      }

      const modelName = modelEl.value || currentModel || DEFAULT_MODEL;
      localStorage.setItem(LS_MODEL, modelName);
      currentModel = modelName;

      appendMessage('user', promptText);
      const assistantMessage = document.createElement('div');
      assistantMessage.className = 'msg assistant';
      assistantMessage.textContent = 'Thinking...';
      chatEl.appendChild(assistantMessage);
      chatEl.scrollTop = chatEl.scrollHeight;

      try {
        abortController = new AbortController();
        const response = await genai.models.generateContent({
          model: modelName,
          contents: [
            {
              role: 'user',
              parts: [{ text: promptText }],
            },
          ],
          config: {
            systemInstruction: 'You are J.A.R.V.I.S, a helpful and professional AI assistant. Keep responses concise, clear, and useful.',
          },
        });

        const answer = response?.text || 'No response returned.';
        assistantMessage.textContent = answer;
        setStatus('Response complete.', 'ok');
      } catch (error) {
        const msg = error?.message || String(error) || 'Unknown Gemini API error';
        assistantMessage.textContent = `Error: ${msg}`;
        setStatus(`Gemini error: ${msg}`, 'error');
      } finally {
        abortController = null;
      }
    }

    function sendPrompt() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      askGemini(text);
    }

    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendPrompt();
      }
    });

    document.getElementById('saveBtn').addEventListener('click', saveApiKey);
    document.getElementById('clearBtn').addEventListener('click', clearApiKey);
    document.getElementById('sendBtn').addEventListener('click', sendPrompt);

    apiKeyEl.value = localStorage.getItem(LS_KEY) || '';
    modelEl.value = localStorage.getItem(LS_MODEL) || DEFAULT_MODEL;
    initGenAI();
  </script>
</body>
</html>
